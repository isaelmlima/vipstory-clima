<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIP Story Clima</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
    linear-gradient(
    180deg,
    #071B45 0%,
    #0E4EA6 100%);

    font-family:Arial, Helvetica, sans-serif;
    color:white;
}

.container{
    height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:space-between;

    padding:60px 40px;
}

.logo{
    width:420px;
}

.local{
    font-size:34px;
    letter-spacing:1px;
    opacity:.9;
}

.temperatura{
    font-size:170px;
    font-weight:bold;
}

.descricao{
    font-size:40px;
    opacity:.9;
}

.info{
    text-align:center;
    line-height:1.8;
    font-size:34px;
}

.hora{
    font-size:42px;
    text-align:center;
}

</style>
</head>

<body>

<div class="container">

<div>

<img src="logo.png"
class="logo">

</div>

<div>

<div class="local">
Padre Bernardo • GO
</div>

<div class="temperatura">
28°
</div>

<div class="descricao">
Carregando clima...
</div>

</div>

<div class="info">

Máx: --°<br>

Mín: --°<br>

Umidade: --%

</div>

<div class="hora" id="hora">

</div>

</div>

<script>

function atualizarHora(){

const agora = new Date();

document.getElementById('hora')
.innerHTML =
agora.toLocaleDateString('pt-BR')
+
'<br>'
+
agora.toLocaleTimeString('pt-BR');

}

atualizarHora();

setInterval(atualizarHora,1000);

</script>

</body>
</html>
