<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIP Story Clima</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
    linear-gradient(
        180deg,
        #0a2d7a 0%,
        #4da3ff 100%
    );

    font-family:'Montserrat',sans-serif;
    color:white;
}

.container{

    height:100vh;

    display:flex;
    flex-direction:column;

    align-items:center;

    justify-content:space-between;

    padding:40px 40px 65px 40px;
}

.topo{

    display:flex;
    flex-direction:column;

    align-items:center;
}

.logo{

    width:320px;
    margin-bottom:15px;
}

.marca{

    font-family:'Orbitron',sans-serif;

    font-size:42px;

    margin-top:-10px;

    font-weight:800;

    letter-spacing:2px;

    text-transform:uppercase;

    text-shadow:
        0 0 10px rgba(255,255,255,.15);
}
}

.submarca{

    font-size:100px;

    letter-spacing:4px;

    margin-top:6px;

    opacity:.9;
}

.local{

    font-size:34px;

    opacity:.92;
    margin-top:70px;

    margin-bottom:15px;
}

.icone{

    font-size:65px;

    margin-bottom:5px;
}

.temperatura{

    font-size:170px;

    font-weight:800;

    line-height:1;
}

.descricao{

    font-size:36px;

    margin-top:10px;

    opacity:.92;
}

.info{

    text-align:center;

    line-height:1.9;

    font-size:32px;

    opacity:.95;
}

.hora{

    text-align:center;

    font-size:40px;

    font-weight:500;
}

</style>

</head>

<body>

<div class="container">

<div class="topo">

<img src="logo.png" class="logo">

<div class="marca">
VIP STORY
</div>

<div class="submarca">
MÍDIA
</div>

</div>

<div>

<div class="local">
Padre Bernardo • GO
</div>

<div class="icone">
☀
</div>

<div class="temperatura">
28°
</div>

<div class="descricao">
Carregando clima...
</div>

</div>

<div class="info">

Máx: --°<br>

Mín: --°<br>

Umidade: --%

</div>

<div class="hora" id="hora">

</div>

</div>

<script>

function atualizarHora(){

const agora = new Date();

document.getElementById("hora").innerHTML =

agora.toLocaleDateString("pt-BR")
+
"<br>"
+
agora.toLocaleTimeString("pt-BR");

}

atualizarHora();

setInterval(atualizarHora,1000);

</script>

</body>
</html>
